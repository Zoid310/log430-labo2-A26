name: CI/CD

on:
  push:
  pull_request:
    branches: [ main ]

# Identifiants lus depuis les secrets du dépôt (Settings > Secrets and variables > Actions).
# Valeurs de développement par défaut si les secrets ne sont pas définis.
env:
  DB_NAME: labo02_db
  DB_USER: ${{ secrets.DB_USER || 'labo02' }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'labo02' }}
  MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || 'root' }}

jobs:
  tests:
    name: Tests (pytest + MySQL + Redis)
    runs-on: ubuntu-latest

    # Mêmes images que docker-compose.yml
    services:
      mysql:
        image: mysql:8.4.7
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || 'root' }}
          MYSQL_DATABASE: labo02_db
          MYSQL_USER: ${{ secrets.DB_USER || 'labo02' }}
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD || 'labo02' }}
        ports:
          - 3306:3306
        # -h 127.0.0.1 force TCP : le serveur temporaire d'initialisation ne répond pas en TCP
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Initialiser la base de données (db-init/init.sql)
        run: docker exec -i ${{ job.services.mysql.id }} mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" < db-init/init.sql

      - name: Créer le fichier .env
        run: |
          cat > .env <<EOF
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=$DB_NAME
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          REDIS_DB=0
          EOF

      - name: Exécuter les tests avec couverture
        run: pytest -v --cov=src --cov-report=term-missing --cov-report=xml --junitxml=rapport-tests.xml

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: |
            rapport-tests.xml
            coverage.xml

  docker:
    name: Image Docker (build, test, publication GHCR)
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      mysql:
        image: mysql:8.4.7
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || 'root' }}
          MYSQL_DATABASE: labo02_db
          MYSQL_USER: ${{ secrets.DB_USER || 'labo02' }}
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD || 'labo02' }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout dépôt
        uses: actions/checkout@v4

      - name: Initialiser la base de données (db-init/init.sql)
        run: docker exec -i ${{ job.services.mysql.id }} mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" < db-init/init.sql

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      # main -> :latest et :main, toujours :sha-<commit> (nom mis en minuscules)
      - name: Calculer les tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: store-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tester l'image (pytest dans le conteneur)
        run: |
          docker run --rm --network host \
            -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e DB_NAME=$DB_NAME \
            -e DB_USER=$DB_USER -e DB_PASSWORD=$DB_PASSWORD \
            -e REDIS_HOST=127.0.0.1 -e REDIS_PORT=6379 -e REDIS_DB=0 \
            store-manager:ci python -m pytest -v

      - name: Authentification à GHCR
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image sur GHCR
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Résumé du déploiement
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          echo "### Image publiée sur GHCR" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
